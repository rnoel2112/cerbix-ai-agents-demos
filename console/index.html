<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerbix demo console</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --text:#e6edf3; --dim:#8b949e; --accent:#2dd4bf;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --slate:#7d8aa0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
  a{color:var(--accent);text-decoration:none;cursor:pointer}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:5}
  header .badge{font-size:11px;color:var(--bg);background:var(--accent);padding:2px 8px;border-radius:10px;font-weight:700}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12px;margin-left:auto}
  .page{max-width:1200px;margin:0 auto;padding:22px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:22px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--accent)}
  .card .nm{font-weight:600;font-size:15px}
  .card .tag{font-size:11px;color:var(--accent);margin:3px 0 9px}
  .card .p{color:var(--dim);font-size:13px}
  .card .runs{margin-top:11px;font-size:12px;color:var(--dim)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .lead{font-size:15px}
  .how{color:var(--dim);font-size:13.5px;margin-top:8px}
  .flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .node{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:8px;padding:9px 12px;font-size:13px;background:var(--panel2)}
  .node.n-agent{border-left-color:var(--blue)} .node.n-cerbix{border-left-color:var(--accent)}
  .node.n-decision{border-left-color:var(--amber)} .node.n-exec{border-left-color:var(--green)}
  .arrow{text-align:center;color:var(--dim);font-size:14px;padding:3px 0}
  .run{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .run:last-child{border-bottom:none}
  .run.sel .rl{color:var(--accent)}
  .rl{flex:1;font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .dot.running{background:var(--amber);animation:pulse 1s infinite} .dot.done{background:var(--green)} .dot.stopped{background:var(--red)}
  @keyframes pulse{50%{opacity:.35}}
  button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:4px 11px;font-size:12px;cursor:pointer;font-weight:500}
  button:hover{border-color:var(--accent)} button.stop{color:var(--red)}
  .console{background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:180px;max-height:420px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin-top:10px}
  .ln{display:block}
  .ln.block{color:#ffb3ae} .ln.redact{color:#f0c674} .ln.shadow{color:#9cc9ff} .ln.allow{color:#7ee787} .ln.cerbix{color:#9db2c8}
  .pol{background:rgba(45,212,191,.16);color:var(--accent);border-radius:4px;padding:0 5px;font-weight:600}
  .summary{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;min-height:16px}
  .chip{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;border:1px solid var(--line);color:var(--dim)}
  .chip.block{color:var(--red);border-color:var(--red)} .chip.redact{color:var(--amber);border-color:var(--amber)}
  .chip.shadow{color:var(--blue);border-color:var(--blue)} .chip.allow{color:var(--green);border-color:var(--green)}
  pre.code{background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:460px}
  .fname{color:var(--accent);font-size:12px;margin:12px 0 4px;font-family:ui-monospace,monospace}
  .vrow{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:7px 10px;margin-bottom:7px;font-size:12px}
  .vrow.block,.vrow.deny{border-left-color:var(--red)} .vrow.redact{border-left-color:var(--amber)} .vrow.shadow{border-left-color:var(--blue)}
  .vrow .d{font-weight:600;text-transform:uppercase;font-size:11px}
  .vrow.block .d,.vrow.deny .d{color:var(--red)} .vrow.redact .d{color:var(--amber)} .vrow.shadow .d{color:var(--blue)}
  .vrow .meta{color:var(--dim);margin-top:2px}
  .muted{color:var(--dim)} details summary{cursor:pointer;color:var(--accent);font-size:13px}
</style>
</head>
<body>
<header><span class="badge">Cerbix</span><h1 id="crumb">Demo console</h1><span class="sub">org: NewBank · live enforcement</span></header>
<div class="page" id="app"></div>
<script>
const app=document.getElementById('app');
let sel=null, timer=null;
async function j(u,o){const r=await fetch(u,o);return r.json();}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function route(){if(timer)clearInterval(timer);const h=location.hash;
  if(h.startsWith('#/a/'))detail(h.slice(4));else list();}

async function list(){
  document.getElementById('crumb').textContent='Demo console';
  const a=await j('/api/agents');
  app.innerHTML=`<h2>Agents</h2><div class="grid">`+a.map(x=>`
    <div class="card" onclick="location.hash='#/a/${x.id}'">
      <div class="nm">${esc(x.name)}</div><div class="tag">${esc(x.tag)}</div>
      <div class="p">${esc(x.purpose)}</div>
      <div class="runs">${x.actions} runnable ${x.actions>1?'scenarios':'scenario'} →</div>
    </div>`).join('')+`</div>
    <h2>Policy violations · live audit</h2><div id="viol"></div>`;
  pollViol(); timer=setInterval(pollViol,2500);
}

function diagram(flow){
  return `<div class="flow">`+flow.map((s,i)=>
    `<div class="node n-${s.k}">${esc(s.t)}</div>`+
    (i<flow.length-1?`<div class="arrow">↓</div>`:'')).join('')+`</div>`;
}

async function detail(id){
  const a=await j('/api/agent/'+id);
  document.getElementById('crumb').innerHTML=`<a onclick="location.hash='#/'">Agents</a> · ${esc(a.name)}`;
  sel=a.actions[0]?a.actions[0].id:null;
  app.innerHTML=`
    <p class="muted"><a onclick="location.hash='#/'">← all agents</a></p>
    <div style="font-size:20px;font-weight:600">${esc(a.name)}</div>
    <div style="color:var(--accent);font-size:12px;margin:2px 0 12px">${esc(a.tag)}</div>
    <div class="box lead">${esc(a.purpose)}<div class="how"><b style="color:var(--text);font-weight:600">How it's built.</b> ${esc(a.how)}</div></div>
    <div class="cols" style="margin-top:22px">
      <div>
        <h2>Block diagram</h2><div class="box">${diagram(a.flow)}</div>
        <h2>Source</h2><details class="box"><summary>View code (${a.code.map(esc).join(', ')})</summary><div id="code">loading…</div></details>
      </div>
      <div>
        <h2>Run</h2><div class="box"><div id="runs"></div></div>
        <div class="summary" id="logsummary"></div>
        <div class="console" id="log"><span class="muted">Pick a scenario and press Start.</span></div>
      </div>
    </div>
    <h2>Policy violations · live audit</h2><div id="viol"></div>`;
  renderRuns(a); loadCode(id); pollViol(); pollLog(id);
  timer=setInterval(()=>{refreshRuns(id);pollLog(id);pollViol();},1600);
}

function renderRuns(a){
  document.getElementById('runs').innerHTML=a.actions.map(x=>`
    <div class="run ${x.id===sel?'sel':''}" onclick="sel='${x.id}';document.querySelectorAll('.run').forEach(e=>e.classList.remove('sel'));this.classList.add('sel');pollLog('${a.id}')">
      <span class="dot ${x.status}" data-a="${x.id}"></span>
      <span class="rl">${esc(x.label)}</span>
      <button onclick="event.stopPropagation();act('run','${a.id}','${x.id}')">▶ Start</button>
      <button class="stop" onclick="event.stopPropagation();act('stop','${a.id}','${x.id}')">■</button>
    </div>`).join('');
}
async function refreshRuns(id){const a=await j('/api/agent/'+id);
  a.actions.forEach(x=>{const d=document.querySelector('.dot[data-a="'+x.id+'"]');if(d)d.className='dot '+x.status;});}
async function act(kind,id,action){sel=action;await fetch('/api/'+kind+'/'+id+'/'+action,{method:'POST'});pollLog(id);refreshRuns(id);}

const VERB={blocked:'block',allowed:'allow',redacted:'redact',shadow:'shadow'};
function classify(l){
  if(/⛔|BLOCKED|DENIED|\bdeny\b|block database|blocked by/i.test(l))return 'block';
  if(/REDACT/i.test(l))return 'redact'; if(/SHADOW|👁/i.test(l))return 'shadow';
  if(/✅|ALLOWED/i.test(l))return 'allow'; if(/cerbix ▸|synced .*polic|cerbix\.init/i.test(l))return 'cerbix';
  return '';}
function fmtLog(lines){const c={block:0,redact:0,shadow:0,allow:0};
  const body=lines.map(l=>{const cls=classify(l);
    const m=/cerbix ▸/.test(l)&&l.match(/BLOCKED|ALLOWED|REDACTED|SHADOW/i);
    if(m){const k=VERB[m[0].toLowerCase()];if(k)c[k]++;}
    let h=esc(l).replace(/(Org rule: [A-Z]+ [—-] [^.<]+)/g,'<span class="pol">$1</span>')
                .replace(/(DLP: \d+ finding\(s\)[^<]*)/g,'<span class="pol">$1</span>');
    return `<span class="ln ${cls}">${h||' '}</span>`;}).join('');
  return {body,c};}
async function pollLog(id){if(!sel)return;
  const d=await j('/api/logs/'+id+'/'+sel);const box=document.getElementById('log');if(!box)return;
  const bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
  if(!d.lines.length){box.innerHTML='<span class="muted">(no output yet)</span>';document.getElementById('logsummary').innerHTML='';return;}
  const r=fmtLog(d.lines);box.innerHTML=r.body;
  const chips=Object.entries(r.c).filter(([,n])=>n>0).map(([k,n])=>`<span class="chip ${k}">${n} ${k}${n>1?'s':''}</span>`).join('');
  document.getElementById('logsummary').innerHTML=chips||(d.status==='running'?'<span class="chip">running…</span>':'');
  if(bottom)box.scrollTop=box.scrollHeight;}
async function loadCode(id){const d=await j('/api/agent/'+id+'/code');
  document.getElementById('code').innerHTML=d.files.map(f=>`<div class="fname">${esc(f.path)}</div><pre class="code">${esc(f.text)}</pre>`).join('');}
async function pollViol(){const el=document.getElementById('viol');if(!el)return;
  const d=await j('/api/violations');
  el.innerHTML=d.violations.length?d.violations.map(v=>{const k=(v.decision||'').toLowerCase();
    return `<div class="vrow ${k}"><span class="d">${esc(v.decision)}</span> · ${esc(v.agent)}<div class="meta">${esc(v.action)} ${esc(v.resource)} · ${esc(v.ts)}</div></div>`;}).join('')
    :'<div class="muted" style="font-size:12px">No recent violations.</div>';}

window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
