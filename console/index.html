<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerbix demo console</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --text:#e6edf3; --dim:#8b949e; --accent:#2dd4bf;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .badge{font-size:11px;color:var(--bg);background:var(--accent);
    padding:2px 8px;border-radius:10px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px;margin-left:auto}
  .wrap{display:grid;grid-template-columns:minmax(240px,330px) minmax(320px,1fr) minmax(240px,330px);
    gap:1px;background:var(--line);height:calc(100vh - 51px)}
  @media(max-width:860px){.wrap{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}}
  .col{background:var(--bg);overflow-y:auto;padding:14px}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--dim);margin:2px 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:11px;margin-bottom:10px;cursor:pointer}
  .card.sel{border-color:var(--accent)}
  .card .top{display:flex;align-items:center;gap:8px}
  .card .name{font-weight:600;font-size:13px}
  .card .desc{color:var(--dim);font-size:12px;margin:5px 0 9px;line-height:1.4}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .dot.running{background:var(--amber);animation:pulse 1s infinite}
  .dot.done{background:var(--green)} .dot.stopped{background:var(--red)}
  @keyframes pulse{50%{opacity:.35}}
  .btns{display:flex;gap:7px}
  button{border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:500}
  button:hover{border-color:var(--accent)}
  button.stop{color:var(--red)}
  .console{background:#0a0d12;border:1px solid var(--line);border-radius:8px;
    padding:12px;height:calc(100% - 68px);overflow-y:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .console .muted{color:var(--dim)}
  .ln{display:block}
  .ln.block{color:#ffb3ae} .ln.redact{color:#f0c674}
  .ln.shadow{color:#9cc9ff} .ln.allow{color:#7ee787} .ln.cerbix{color:#9db2c8}
  .pol{background:rgba(45,212,191,.16);color:var(--accent);border-radius:4px;
    padding:0 5px;font-weight:600}
  .summary{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap;min-height:18px}
  .chip{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;
    border:1px solid var(--line);color:var(--dim)}
  .chip.block{color:var(--red);border-color:var(--red)}
  .chip.redact{color:var(--amber);border-color:var(--amber)}
  .chip.shadow{color:var(--blue);border-color:var(--blue)}
  .chip.allow{color:var(--green);border-color:var(--green)}
  .vrow{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px}
  .vrow.block{border-left-color:var(--red)} .vrow.deny{border-left-color:var(--red)}
  .vrow.redact{border-left-color:var(--amber)} .vrow.shadow{border-left-color:var(--blue)}
  .vrow .d{font-weight:600;text-transform:uppercase;font-size:11px}
  .vrow.block .d,.vrow.deny .d{color:var(--red)}
  .vrow.redact .d{color:var(--amber)} .vrow.shadow .d{color:var(--blue)}
  .vrow .meta{color:var(--dim);margin-top:3px}
  .empty{color:var(--dim);font-size:12px;padding:8px 2px}
</style>
</head>
<body>
<header>
  <span class="badge">Cerbix</span>
  <h1>Demo console</h1>
  <span class="sub">org: NewBank · live enforcement</span>
</header>
<div class="wrap">
  <div class="col" id="agents"><h2>Agents</h2></div>
  <div class="col"><h2 id="logtitle">Live log</h2><div class="summary" id="logsummary"></div><div class="console" id="log"><span class="muted">Select an agent and press Start.</span></div></div>
  <div class="col"><h2>Policy violations · live audit</h2><div id="viol"></div></div>
</div>
<script>
let selected = null;
async function j(u,o){const r=await fetch(u,o);return r.json();}

async function renderAgents(){
  const a = await j('/api/agents');
  const el = document.getElementById('agents');
  const cards = Object.entries(a).map(([id,v])=>`
    <div class="card ${selected===id?'sel':''}" data-id="${id}" onclick="select('${id}')">
      <div class="top"><span class="dot ${v.status}"></span><span class="name">${v.name}</span></div>
      <div class="desc">${v.desc}</div>
      <div class="btns">
        <button onclick="event.stopPropagation();act('start','${id}')">▶ Start</button>
        <button class="stop" onclick="event.stopPropagation();act('stop','${id}')">■ Stop</button>
      </div>
    </div>`).join('');
  el.innerHTML = '<h2>Agents</h2>'+cards;
}
async function act(kind,id){selected=id;await fetch('/api/'+kind+'/'+id,{method:'POST'});renderAgents();pollLog();}
function select(id){selected=id;renderAgents();pollLog();}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function classify(l){
  if(/⛔|BLOCKED|DENIED|\bdeny\b|block database|blocked by/i.test(l))return 'block';
  if(/REDACT/i.test(l))return 'redact';
  if(/SHADOW|👁/i.test(l))return 'shadow';
  if(/✅|ALLOWED/i.test(l))return 'allow';
  if(/cerbix ▸|synced .*polic|cerbix\.init/i.test(l))return 'cerbix';
  return '';
}
const VERB={blocked:'block',allowed:'allow',redacted:'redact',shadow:'shadow'};
function fmtLog(lines){
  const counts={block:0,redact:0,shadow:0,allow:0};
  const body = lines.map(l=>{
    const cls=classify(l);
    // Count only the authoritative "cerbix ▸ <VERB>" decision lines, not the
    // agent's prose or the downstream "DENIED …" echo.
    const m=/cerbix ▸/.test(l) && l.match(/BLOCKED|ALLOWED|REDACTED|SHADOW/i);
    if(m){const k=VERB[m[0].toLowerCase()]; if(k) counts[k]++;}
    // Badge the specific policy that fired ("the policy in question").
    let html=esc(l).replace(/(Org rule: [A-Z]+ [—-] [^.<]+)/g,'<span class="pol">$1</span>')
                   .replace(/(DLP: \d+ finding\(s\)[^<]*)/g,'<span class="pol">$1</span>');
    return `<span class="ln ${cls}">${html||' '}</span>`;
  }).join('');
  return {body,counts};
}
async function pollLog(){
  if(!selected)return;
  document.getElementById('logtitle').textContent='Live log · '+selected;
  const d = await j('/api/logs/'+selected);
  const box = document.getElementById('log');
  const atBottom = box.scrollTop+box.clientHeight >= box.scrollHeight-30;
  if(!d.lines.length){box.innerHTML='<span class="muted">(no output yet)</span>';
    document.getElementById('logsummary').innerHTML='';return;}
  const {body,counts}=fmtLog(d.lines);
  box.innerHTML=body;
  const chips=Object.entries(counts).filter(([,n])=>n>0)
    .map(([k,n])=>`<span class="chip ${k}">${n} ${k}${n>1?'s':''}</span>`).join('');
  document.getElementById('logsummary').innerHTML = chips ||
    (d.status==='running'?'<span class="chip">running…</span>':'');
  if(atBottom) box.scrollTop = box.scrollHeight;
}
async function pollViol(){
  const d = await j('/api/violations');
  const el = document.getElementById('viol');
  if(!d.violations.length){el.innerHTML='<div class="empty">No recent violations.</div>';return;}
  el.innerHTML = d.violations.map(v=>{
    const k=(v.decision||'').toLowerCase();
    return `<div class="vrow ${k}"><span class="d">${v.decision}</span> · ${v.agent}
      <div class="meta">${v.action} ${v.resource}<br>${v.ts}</div></div>`;
  }).join('');
}
renderAgents();
setInterval(()=>{renderAgents();pollLog();pollViol();},1500);
pollViol();
</script>
</body>
</html>
